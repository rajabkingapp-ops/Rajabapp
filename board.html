<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajab King YT - Board Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 0, 100, 0.05) 40px, rgba(255, 0, 100, 0.05) 41px); }
        .app-container { width: 100%; max-width: 950px; height: 520px; background-color: #121622; border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.9); border: 1px solid #1f293d; display: flex; position: relative; overflow: hidden; }
        
        .sidebar { width: 70px; background-color: #0d1117; border-right: 1px solid #1f293d; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 25px; }
        .sidebar i { color: #8b949e; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .sidebar i.active { color: #ff0055; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-bar { height: 60px; border-bottom: 1px solid #1f293d; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; background-color: #121622; }
        .top-bar h1 { font-size: 16px; letter-spacing: 1px; color: #fff; }
        .dashboard-body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; background-color: #0b0f19; overflow-y: auto; }
        
        .welcome-banner { background: linear-gradient(135deg, #161b28, #1f293d); border: 1px solid #232d42; border-radius: 10px; padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .dp-avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #ff0055; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
        .dp-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .welcome-banner h2 { color: #ff0055; font-size: 18px; }
        .welcome-banner p { color: #8b949e; font-size: 12px; margin-top: 5px; }

        .control-box { background-color: #161b28; border: 1px solid #1f293d; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .control-box input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; outline: none; }
        .btn-board { padding: 10px; background: #ff0055; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <i class="fa-solid fa-border-all active" title="Board Dashboard"></i>
        </div>
        <div class="main-content">
            <div class="top-bar">
                <h1>RAJAB KING YT - BOARD PANEL</h1>
                <span style="font-size: 12px; color: #2ea043;"><i class="fa-solid fa-check-circle"></i> Live Connected to Admin</span>
            </div>
            <div class="dashboard-body">
                <div class="welcome-banner">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="dp-avatar">
                            <img src="https://i.postimg.cc/k4M2nz99/1789643546627.png" alt="User DP">
                        </div>
                        <div>
                            <h2>Board Panel (User Access)</h2>
                            <p>Admin द्वारा बदला गया पासवर्ड यहाँ तुरंत लाइव लागू होता है।</p>
                        </div>
                    </div>
                </div>

                <div class="control-box">
                    <h3 style="font-size: 14px; color: #8b949e;">Admin Ke Dwara Set Kiya Gaya Password Test Karein:</h3>
                    <input type="password" id="verify-pass" placeholder="Enter password set by Admin">
                    <button class="btn-board" onclick="checkPassword()">VERIFY PASSWORD</button>
                    <p id="result-text" style="font-size: 13px; margin-top: 5px;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Config -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // यहाँ भी वही असली Firebase Config डिटेल्स डाली गई हैं[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyDxMaykly19vWvZVFsuv8... (यहीं आपकी असली की है)",
            authDomain: "rajab-fb9a8.firebaseapp.com",
            databaseURL: "https://rajab-fb9a8-default-rtdb.firebaseio.com",
            projectId: "rajab-fb9a8",
            storageBucket: "rajab-fb9a8.appspot.com",
            messagingSenderId: "105436669992",
            appId: "1:105436669992:web:abcdef..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let liveAdminPassword = "12345";

        const passwordRef = ref(db, 'boardSettings/password');
        onValue(passwordRef, (snapshot) => {
            const data = snapshot.val();
            if (data !== null) {
                liveAdminPassword = data;
            }
        });

        window.checkPassword = function() {
            const enteredPass = document.getElementById('verify-pass').value.trim();
            const resultText = document.getElementById('result-text');

            if(enteredPass === liveAdminPassword) {
                resultText.style.color = "#2ea043";
                resultText.innerHTML = "<i class='fa-solid fa-check'></i> Password Bilkul Sahi Hai! Access Granted.";
            } else {
                resultText.style.color = "#f85149";
                resultText.innerHTML = "<i class='fa-solid fa-xmark'></i> Galat Password! Admin se naya password pata karein.";
            }
        }
    </script>
</body>
</html>
